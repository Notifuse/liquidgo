name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # amd64 and arm64: the output must be the same on every CPU.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Test with the race detector
        run: go test -race ./...
      - name: Build for 32-bit platforms
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=linux GOARCH=386 go vet ./...
          GOOS=linux GOARCH=arm go build ./...

  windows:
    # The paths of LocalFileSystem.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -short ./...

  reference:
    # The expected outputs of the differential corpus are those of Shopify
    # Liquid 5.11.0, which liquidgo ports, and every result of liquidgo
    # matches them or is a listed divergence. The reference-liquid submodule
    # is at another version, so the job checks out 5.11.0 itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install Shopify Liquid 5.11.0
        run: |
          git clone -q --depth 1 --branch v5.11.0 https://github.com/Shopify/liquid "$RUNNER_TEMP/shopify-liquid"
          gem install --no-document strscan:'>= 3.1.1' bigdecimal
      - name: Check the expected outputs
        run: TZ=UTC ruby -I "$RUNNER_TEMP/shopify-liquid/lib" scripts/differential_reference.rb --check
      - name: Compare with Shopify
        run: go test ./integration -run '^(TestShopifyConformance|TestShopifyDifferential)$' -v

  fuzz:
    # Two minutes of fuzzing find no panic and no output that changes from
    # one parse to the next.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz the render
        run: go test ./integration -run '^$' -fuzz FuzzRender -fuzztime 2m
      - name: Keep the input the fuzzer failed on
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: integration/testdata/fuzz/FuzzRender
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.2
          args: --timeout=5m
