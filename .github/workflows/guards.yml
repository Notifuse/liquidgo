name: Guards

# Each guard of the library (resource limits, depth, the end of a render, what
# a template reads of Go values, output escaping, template files) is removed in
# turn, and a test must fail without it. The run takes several minutes, so it
# runs on main, after each merge, and on demand before a release: a release is
# tagged only once this workflow is green on the commit to tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Remove each guard and run the tests
        run: go run ./scripts/guard_mutations
