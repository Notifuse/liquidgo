name: Test Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The library is covered by its own tests and by the integration tests,
      # which render through its public API: both count.
      - name: Run tests with coverage
        run: go test -coverpkg=./liquid/... -coverprofile=coverage.out ./liquid/... ./integration

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Notifuse/liquidgo
          file: ./coverage.out
