coverage:
  status:
    # liquidgo's code is covered at more than 90%, the code a change touches too
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%
  range: '60...80'
  ignore:
    - '**/performance/**'
    - '**/reference-liquid/**'
    - '**/integration/**'
    - '**/examples/**'
    - '**/tests/**'
    - '**/testutil/**'
